name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Build, lint, and test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux
            runner_arch: X64
            target: x86_64-unknown-linux-gnu
            cross_target: ""
            timeout_minutes: 15
            test_shard: workspace
            test_skip: ""
          - os: ubuntu-24.04-arm
            platform: Linux aarch64
            runner_arch: ARM64
            target: aarch64-unknown-linux-gnu
            cross_target: ""
            timeout_minutes: 20
            test_shard: workspace
            test_skip: ""
          - os: macos-latest
            platform: macOS
            runner_arch: ARM64
            target: aarch64-apple-darwin
            cross_target: x86_64-apple-darwin
            timeout_minutes: 20
            test_shard: workspace
            test_skip: ""
          - os: windows-latest
            platform: Windows
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            cross_target: ""
            timeout_minutes: 40
            test_shard: workspace
            test_skip: "--skip persistence::"
          - os: windows-latest
            platform: Windows persistence
            runner_arch: X64
            target: x86_64-pc-windows-msvc
            cross_target: ""
            timeout_minutes: 40
            test_shard: persistence
            test_skip: ""
          - os: windows-11-arm
            platform: Windows aarch64
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            cross_target: ""
            timeout_minutes: 40
            test_shard: workspace
            test_skip: "--skip persistence::"
          - os: windows-11-arm
            platform: Windows aarch64 persistence
            runner_arch: ARM64
            target: aarch64-pc-windows-msvc
            cross_target: ""
            timeout_minutes: 40
            test_shard: persistence
            test_skip: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show pinned Rust toolchain and target
        run: |
          echo "Runner architecture: ${{ runner.arch }}"
          echo "Expected target: ${{ matrix.target }}"
          rustc -vV
          cargo --version
          rustfmt --version
          cargo clippy --version

      - name: Reject an unexpected runner architecture
        if: ${{ runner.arch != matrix.runner_arch }}
        run: |
          echo "Expected ${{ matrix.runner_arch }}, received ${{ runner.arch }}"
          exit 1

      - name: Check formatting
        if: ${{ matrix.test_shard != 'persistence' }}
        run: cargo fmt --all -- --check

      - name: Install native target
        run: rustup target add ${{ matrix.target }}

      - name: Check workspace
        if: ${{ matrix.test_shard != 'persistence' }}
        run: cargo check --workspace --target ${{ matrix.target }} --locked

      - name: Run Clippy
        if: ${{ matrix.test_shard != 'persistence' }}
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings

      - name: Run workspace tests
        if: ${{ matrix.test_shard != 'persistence' }}
        # SQLite-heavy integration tests otherwise contend enough on hosted runners
        # to exhaust test-only observation deadlines without a product failure.
        run: cargo test --workspace --target ${{ matrix.target }} --locked -- ${{ matrix.test_skip }} --test-threads 2

      - name: Run persistence tests
        if: ${{ matrix.test_shard == 'persistence' }}
        run: >-
          cargo test -p morons-server --lib --target ${{ matrix.target }} --locked persistence:: -- --test-threads 2

      - name: Install cross-compilation target
        if: ${{ matrix.cross_target != '' }}
        run: rustup target add ${{ matrix.cross_target }}

      - name: Check cross-compilation target
        if: ${{ matrix.cross_target != '' }}
        run: cargo check --workspace --all-targets --target ${{ matrix.cross_target }} --locked

  dependency-policy:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-deny
        run: cargo install cargo-deny --version '=0.20.2' --locked

      - name: Check dependency policy
        run: cargo deny --all-features check licenses bans sources
