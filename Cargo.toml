[workspace]
members = [
    "crates/morons-cli",
    "crates/morons-protocol",
    "crates/morons-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/lilfrogdev/morons.dev"
publish = false

[workspace.dependencies]
fence-windows = "=0.1.0-alpha.2"
getrandom = { version = "=0.4.3", features = ["std"] }
hmac = { version = "=0.13.0", default-features = false }
interprocess = { version = "=2.4.3", default-features = false, features = ["tokio"] }
rustix = { version = "=1.1.4", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "load_extension"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false }
widestring = "=1.2.1"

[workspace.lints.rust]
unsafe_code = "deny"
