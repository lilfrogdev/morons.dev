[workspace]
members = [
    "crates/morons-cli",
    "crates/morons-image",
    "crates/morons-protocol",
    "crates/morons-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/lilfrogdev/morons.dev"
publish = false

[workspace.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "=0.22.1"
bytes = "=1.12.1"
fence-windows = "=0.1.0-alpha.2"
getrandom = { version = "=0.4.3", features = ["std"] }
hmac = { version = "=0.13.0", default-features = false }
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.10.0", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = ["aws-lc-rs", "http1", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["client-legacy", "http1", "tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
interprocess = { version = "=2.4.3", default-features = false, features = ["tokio"] }
ratatui = { version = "=0.30.2", default-features = false, features = ["std", "unstable-rendered-line-info"] }
ratatui-crossterm = "=0.1.2"
rustix = { version = "=1.1.4", default-features = false }
rusqlite = { version = "=0.40.2", default-features = false, features = ["backup", "bundled", "limits", "load_extension"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = { version = "=0.11.0", default-features = false }
tokio = { version = "=1.53.1", default-features = false }
widestring = "=1.2.1"
yaml-rust2 = { version = "=0.12.0", default-features = false }
zeroize = { version = "=1.9.0", default-features = false, features = ["alloc"] }

[workspace.lints.rust]
unsafe_code = "deny"
