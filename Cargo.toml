[workspace]
members = [
    "crates/morons-cli",
    "crates/morons-protocol",
    "crates/morons-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/lilfrogdev/morons.dev"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
