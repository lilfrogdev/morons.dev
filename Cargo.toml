[workspace]
members = [
    "crates/morons-cli",
    "crates/morons-protocol",
    "crates/morons-server",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/lilfrogdev/morons.dev"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
